management:
  endpoint:
    health:
      probes:
        enabled: true
      enabled: true
  endpoints:
    web:
      base-path: /

server:
  servlet:
    context-path: /whenyou-mdms-services
  port: 8084


spring:
  datasource:

    driverClassName: org.postgresql.Driver

    url: jdbc:postgresql://localhost:5432/master-data

    username: postgres

    password: postgres

  liquibase:

    enabled: 'true'

    drop-first: 'false'

    change-log: classpath:/db/changelog/changelog-master.xml

  jpa:

    hibernate:

      ddl-auto: none

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 200MB







